name: Wireshark

# The crate beside Wireshark's dissector of GTPv2-C, on the same messages: the test
# wireshark writes what the crate reads of each, tshark dissects them as datagrams to port
# 2123, and tests/wireshark/compare.py compares the two field by field, by
# tests/wireshark/mapping.tsv. tshark is 4.6.4, the version that tests/wireshark/known.tsv
# was triaged with: the package 4.6.4-1 of Ubuntu 26.04, which its updates do not replace
# here. A difference that known.tsv does not explain fails the job, and so does a run in
# which nothing is compared. The messages are go-gtp's vectors, the messages of the lab
# captures, the seeds of the fuzz targets, and the corpora of the fuzz targets decode and
# tree that the Fuzz workflow keeps in the cache of the repository. Each Monday at 06:33
# UTC; the report is kept for 30 days.
on:
  schedule:
    - cron: "33 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wireshark:
    name: Wireshark 4.6.4
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: tshark 4.6.4
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            tshark=4.6.4-1 wireshark-common=4.6.4-1 libwireshark19=4.6.4-1 \
            libwiretap16=4.6.4-1 libwsutil17=4.6.4-1 libwireshark-data=4.6.4-1
          tshark --version | head -n 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The corpus of each target as its last run kept it: the key is none of the keys,
      # and the newest cache whose key begins with the prefix is restored
      - uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/decode
          key: fuzz-corpus-decode-none
          restore-keys: fuzz-corpus-decode-
      - uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/tree
          key: fuzz-corpus-tree-none
          restore-keys: fuzz-corpus-tree-
      - name: The messages, and what the crate reads of them
        run: |
          mkdir -p fuzz/corpus/decode fuzz/corpus/tree
          python3 tests/wireshark/corpus.py "$RUNNER_TEMP/corpus.tsv" fuzz/seeds \
            fuzz/corpus/decode fuzz/corpus/tree
          GTPV2C_WIRESHARK_CORPUS="$RUNNER_TEMP/corpus.tsv" GTPV2C_WIRESHARK_CRATE="$RUNNER_TEMP/crate.jsonl" \
            cargo test --release --all-features --test wireshark -- --ignored
      - name: Compare
        run: >-
          python3 -I tests/wireshark/compare.py --corpus "$RUNNER_TEMP/corpus.tsv"
          --crate "$RUNNER_TEMP/crate.jsonl" --mapping tests/wireshark/mapping.tsv
          --known tests/wireshark/known.tsv --output "$RUNNER_TEMP/wireshark"
      - name: Summary
        if: always()
        run: |
          summary=$RUNNER_TEMP/wireshark/summary.txt
          test -s "$summary" || { echo "::error::nothing was compared with Wireshark"; exit 1; }
          { echo '```'; cat "$summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wireshark
          path: ${{ runner.temp }}/wireshark
          retention-days: 30
