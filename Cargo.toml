[package]
name = "oxirush-gtpv2c"
version = "0.1.0"
edition = "2024"
description = "GTPv2-C (3GPP TS 29.274, Release 19) in Rust: decode, build, check and encode the messages and IEs of S11, S5/S8, S10 and N26, and edit them as JSON. no_std."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-gtpv2c"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["gtp", "gtpv2", "lte", "n26", "3gpp"]
categories = ["network-programming", "encoding", "parser-implementations", "no-std"]
readme = "README.md"
# On GitHub alone, not on crates.io yet.
publish = false
# Anchored to the root: an unanchored name is a gitignore glob, which matches a file of
# that name in any directory. tests/README.md, which names the fixtures and the scripts
# that write them, is named.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/**/*.tsv",
    "/tests/**/*.py",
    "/tests/README.md",
    "/examples/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
]

[features]
# The tree of a message, its paths and its edits, on the engine of oxirush-utils.
tree = ["oxirush-utils/tree"]
# The layout of each value as the crate reads it, which the test `spec` compares with the
# figures of the document: for that test alone.
spec = []

[dependencies]
oxirush-utils = { version = "0.4.0", default-features = false, features = ["alloc", "fields", "tables"] }

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"

[lints.rust]
# docs.rs sets `docsrs`. The table macros of oxirush-utils write the accounting of the
# memory of a scope under `feature = "endpoint"`, a feature of PFCP that this crate does not
# have.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)', 'cfg(feature, values("endpoint"))'] }

[[example]]
name = "inspect"
required-features = ["tree"]

[[test]]
name = "n26"
required-features = ["tree"]

[[test]]
name = "wireshark"
required-features = ["tree"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# oxirush-utils 0.4.0 is not released yet: the build takes it from this revision until it is.
[patch.crates-io]
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "ee04f4eff50c2f099884479e7f71965ea546cd9e" }
