# cargo-mutants 27.1.0: `cargo mutants` in the directory of the crate, or the Mutants
# workflow, which runs it in shards.
#
# Every feature, so that the trees and their paths are mutated and the tests of each of
# them run. The bodies of the macros of src/macros.rs and of oxirush-utils, which write
# the codec of each table and layout, are not mutated: cargo-mutants leaves
# `macro_rules!` alone.
all_features = true

exclude_re = [
    # The octets of a code of a ULI, shifted into a number of no bit below them: `^` joins
    # them as `|` does. So are the flags of the identities, each of its own bit, and the
    # spare bits above a code that is checked to fit its bits (src/uli.rs).
    "src/uli\\.rs:\\d+:\\d+: replace \\| with \\^ in <impl Codec for Uli>::(decode|encode)$",
    # The spare bits of an identity are 0, 3 or 4, never 8: `<= 8` is `< 8` (src/uli.rs).
    "src/uli\\.rs:\\d+:\\d+: replace < with <= in <impl Codec for Uli>::encode$",
    # Deviations of the value of an IE that check_field gives it, at their place in the
    # list: `>=` also gives it an empty list, which changes nothing (src/check.rs).
    "src/check\\.rs:\\d+:\\d+: replace > with >= in check_field$",
    # An IE of octet 4 of 0x0f, no spare bit, reaches of_no_row only where its table has
    # no row of instance 15, which it would be placed in: `>=` then finds no row either.
    "src/check\\.rs:\\d+:\\d+: replace > with >= in <impl oxirush_utils::tables::Checking for crate::Gtpv2c>::of_no_row$",
]
